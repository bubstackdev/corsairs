[package]
name = "corsairs"
version = "0.3.0-dev"
edition.workspace = true
rust-version.workspace = true
publish = true
description = "Safe Rust inference with Apple Core AI on Apple Silicon"
license = "MIT OR Apache-2.0"
keywords = ["coreai", "inference", "apple", "machine-learning"]
categories = ["science"]
readme = "README.md"
repository = "https://github.com/bubstackdev/corsairs"

[features]
default = []
# Development probes expose unsafe ABI experiments; not part of the safe API.
abi-research = []

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = []

[[test]]
name = "native_metadata"
required-features = ["abi-research"]

[lints]
workspace = true
